name: Sync YouTube videos
on:
  schedule: [{ cron: '11,41 * * * *' }]
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      test:
        description: 'Commit a harmless test file to exercise sync-commit then deploy'
        type: boolean
        default: false
concurrency: { group: pages-deploy, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/sync.mjs
        env: { YOUTUBE_API_KEY: '${{ secrets.YOUTUBE_API_KEY }}' }
      - name: Test file
        if: ${{ inputs.test }}
        run: date -u > data/deploy-test.txt
      - id: commit
        run: |
          git config user.name studxi-bot; git config user.email bot@users.noreply.github.com
          git add data/
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else git commit -m "sync videos" && git push && echo "changed=true" >> "$GITHUB_OUTPUT"; fi
  deploy:
    needs: sync
    if: ${{ github.event_name != 'schedule' || needs.sync.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/configure-pages@v5
      - name: Build marker
        run: printf '{"built":"%s","commit":"%s","event":"%s"}\n' "$(date -u +%FT%TZ)" "$(git rev-parse --short HEAD)" "${{ github.event_name }}" > build.json
      - uses: actions/upload-pages-artifact@v4
        with: { path: . }
      - id: deployment
        uses: actions/deploy-pages@v4
