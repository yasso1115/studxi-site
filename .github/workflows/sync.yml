name: Sync YouTube videos
on:
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch:
    inputs:
      test:
        description: 'Write a test file to exercise commit and Pages deploy'
        type: boolean
        default: false
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/sync.mjs
        env: { YOUTUBE_API_KEY: '${{ secrets.YOUTUBE_API_KEY }}' }
      - name: Test file
        if: ${{ inputs.test }}
        run: date -u > data/deploy-test.txt
      - run: |
          git config user.name studxi-bot; git config user.email bot@users.noreply.github.com
          git add data/; git diff --cached --quiet || (git commit -m "sync videos" && git push)
