name: Sync YouTube videos
on:
  schedule: [{ cron: '*/30 * * * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/sync.mjs
        env: { YOUTUBE_API_KEY: '${{ secrets.YOUTUBE_API_KEY }}' }
      - run: |
          git config user.name studxi-bot; git config user.email bot@users.noreply.github.com
          git add data/videos.json; git diff --cached --quiet || (git commit -m "sync videos" && git push)
